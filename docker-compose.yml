services:
  tg2cloud-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tg2cloud-bot-api
    restart: always
    env_file:
      - .env
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8082"
      TELEGRAM_STAT_PORT: "8083"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    volumes:
      - ./bot-api-data:/var/lib/telegram-bot-api
      - /tmp:/tmp
    ports:
      - "127.0.0.1:8082:8082"

  tg2cloud-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg2cloud-bot
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      LOG_DIR: /logs
      RCLONE_CONFIG_PATH: /config/rclone/rclone.conf
      TG2CLOUD_COMPOSE_SERVICE: tg2cloud-bot
      LOCAL_BOT_API_URL: http://127.0.0.1:8082
      BOT_API_DATA_DIR: /bot-api-data
    user: "10001:10001"
    group_add:
      - "101"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
      - ./logs:/logs
      - ./config:/config
      - ./bot-api-data:/bot-api-data
      - ./app:/opt/tg2cloud/app:ro
    network_mode: host
    restart: always
    stop_grace_period: 45s